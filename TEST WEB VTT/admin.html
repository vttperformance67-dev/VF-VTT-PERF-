<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace admin — Vélos Performances</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { font-family: 'Inter', system-ui, sans-serif; }
body { background: #0a1628; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.card { background: #0f2341; border: 1px solid rgba(255,255,255,.08); border-radius: 1rem; padding: 2.5rem; width: 100%; max-width: 400px; }
.field { width: 100%; padding: .75rem 1rem; border-radius: .5rem; font-size: .95rem; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.05); color: white; outline: none; transition: border-color .15s; }
.field:focus { border-color: #afd5eb; }
.field::placeholder { color: rgba(255,255,255,.3); }
.btn-main { width: 100%; padding: .8rem; border-radius: .5rem; font-weight: 700; font-size: .95rem; background: linear-gradient(135deg, #2563eb, #0ea5e9); color: white; border: none; cursor: pointer; transition: opacity .15s; }
.btn-main:hover { opacity: .9; }
.btn-main:disabled { opacity: .5; cursor: not-allowed; }
.err { color: #f87171; font-size: .85rem; margin-top: .5rem; text-align: center; }
.ok  { color: #4ade80; font-size: .85rem; margin-top: .5rem; text-align: center; }
.link-btn { background: none; border: none; color: #64748b; font-size: .78rem; cursor: pointer; text-decoration: underline; }
.link-btn:hover { color: #94a3b8; }
</style>
</head>
<body>

<div class="card">

  <!-- LOGO -->
  <div class="text-center mb-8">
    <div class="text-3xl mb-2">🚵</div>
    <h1 class="text-white font-bold text-xl">Vélos Performances</h1>
    <p class="text-slate-400 text-sm mt-1">Espace administrateur</p>
  </div>

  <!-- LOGIN -->
  <div id="view-login" class="hidden space-y-4">
    <div>
      <label class="text-xs text-slate-400 uppercase tracking-wider mb-1 block">Identifiant</label>
      <input type="text" id="login-user" class="field" placeholder="Identifiant admin" onkeydown="if(event.key==='Enter')document.getElementById('login-pwd').focus()">
    </div>
    <div>
      <label class="text-xs text-slate-400 uppercase tracking-wider mb-1 block">Mot de passe</label>
      <input type="password" id="login-pwd" class="field" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()">
    </div>
    <div id="login-err" class="err hidden"></div>
    <button class="btn-main" id="login-btn" onclick="login()">Accéder à l'espace admin</button>
    <div class="text-center mt-2">
      <button class="link-btn" onclick="showReset()">Mot de passe oublié</button>
    </div>
  </div>

  <!-- RESET -->
  <div id="view-reset" class="hidden space-y-4">
    <p class="text-slate-300 text-sm text-center">Entrez le code de réinitialisation pour créer un nouveau mot de passe.</p>
    <div>
      <label class="text-xs text-slate-400 uppercase tracking-wider mb-1 block">Code de réinitialisation</label>
      <input type="text" id="reset-code" class="field" placeholder="Code reset">
    </div>
    <div id="reset-err" class="err hidden"></div>
    <button class="btn-main" onclick="checkReset()">Valider</button>
    <div class="text-center">
      <button class="link-btn" onclick="showLogin()">← Retour</button>
    </div>
  </div>

  <!-- MENU ADMIN (après connexion) -->
  <div id="view-menu" class="hidden space-y-3">
    <p class="text-slate-300 text-sm text-center mb-1">Connecté en tant qu'administrateur</p>
    <div id="pending-badge" class="hidden text-center">
      <span id="pending-count-badge" class="inline-block bg-red-500 text-white text-xs font-bold px-3 py-1 rounded-full"></span>
    </div>
    <button onclick="showPending()" class="btn-main w-full text-left flex items-center justify-between">
      <span>📋 Réservations en attente</span>
      <span id="pending-num" class="bg-white text-slate-900 text-xs font-bold px-2 py-0.5 rounded-full"></span>
    </button>
    <a href="velos.html" class="flex items-center justify-center gap-2 py-3 px-4 rounded-lg font-semibold text-sm border border-slate-600 text-slate-300 hover:border-slate-400 hover:text-white transition-colors no-underline" style="display:flex;">
      🚲 Parc vélos & historique
    </a>
    <a href="contrat.html" class="flex items-center justify-center gap-2 py-3 px-4 rounded-lg font-semibold text-sm border border-slate-600 text-slate-300 hover:border-slate-400 hover:text-white transition-colors no-underline" style="display:flex;">
      📄 Contrat en magasin
    </a>
    <div class="pt-4 border-t border-slate-700 flex justify-end items-center">
      <button class="link-btn text-red-400 hover:text-red-300" onclick="logout()">Déconnexion</button>
    </div>
  </div>

  <!-- RÉSERVATIONS EN ATTENTE -->
  <div id="view-pending" class="hidden space-y-4">
    <div class="flex items-center justify-between">
      <h2 class="text-white font-bold text-base">Réservations en attente</h2>
      <button class="link-btn" onclick="showMenu()">← Retour</button>
    </div>
    <div id="pending-list" class="space-y-3 max-h-96 overflow-y-auto"></div>
  </div>


</div>

<script>
// Credentials fixes (SHA-256 — non modifiables depuis l'interface)
// velosperformances | Jenemeferaisplushacker555*
const ADMIN_USER_HASH = '20274b291147c49533aa4151ec8e979ea38b3a1ea4837366bed9a0d59e81f15d';
const ADMIN_PWD_HASH  = '5111bded20784dba41bbf454e697c5136f3c0987a9e598bb5d77a6b9056c2f8b';
const SESSION_KEY = 'vp_admin_session';

// ============================================================
// Crypto — SHA-256 via Web Crypto API
// ============================================================
async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

// ============================================================
// Navigation entre vues
// ============================================================
const views = ['login','reset','menu','pending'];
function show(v) {
  views.forEach(n => { var el=document.getElementById('view-'+n); if(el) el.classList.add('hidden'); });
  document.getElementById('view-'+v).classList.remove('hidden');
}
function showLogin() { clearErrors(); show('login'); setTimeout(()=>document.getElementById('login-user').focus(),50); }
function showReset() { clearErrors(); show('reset'); }
function showMenu()  { show('menu'); updatePendingBadge(); }

function clearErrors() {
  ['setup-err','login-err','reset-err','chg-err'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.classList.add('hidden'); el.textContent = ''; }
  });
}
function err(id, msg) {
  const el = document.getElementById(id);
  if (el) { el.textContent = msg; el.classList.remove('hidden'); }
}

// ============================================================
// Initialisation
// ============================================================
function showPending() {
  show('pending');
  renderPending();
}

function renderPending() {
  const list  = document.getElementById('pending-list');
  const all   = JSON.parse(localStorage.getItem('vp_pending') || '[]');
  const pend  = all.filter(r => r.status === 'pending');
  if (pend.length === 0) {
    list.innerHTML = '<p style="color:#94a3b8;font-size:.85rem;text-align:center;">Aucune réservation en attente.</p>';
    return;
  }
  list.innerHTML = pend.map(r => `
    <div style="background:#1e3a5f;border:1px solid rgba(255,255,255,.1);border-radius:.75rem;padding:1rem;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem;margin-bottom:.75rem;">
        <div>
          <p style="color:#7dd3fc;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin:0;">${r.id}</p>
          <p style="color:white;font-weight:700;font-size:.95rem;margin:.2rem 0 0;">${r.nom || ''} ${r.prenom || ''}</p>
          <p style="color:#94a3b8;font-size:.8rem;margin:.1rem 0 0;">${r.email || ''} · ${r.telephone || ''}</p>
        </div>
        <p style="color:#64748b;font-size:.7rem;white-space:nowrap;">${new Date(r.ts).toLocaleDateString('fr-FR')}</p>
      </div>
      <div style="background:rgba(0,0,0,.2);border-radius:.5rem;padding:.6rem .75rem;margin-bottom:.75rem;font-size:.8rem;color:#cbd5e1;">
        <strong style="color:white;">Vélo :</strong> ${r.modele_libre || '—'}<br>
        <strong style="color:white;">Créneau :</strong> ${r.date_debut ? new Date(r.date_debut).toLocaleString('fr-FR') : '—'} → ${r.date_fin ? new Date(r.date_fin).toLocaleString('fr-FR') : '—'}<br>
        <strong style="color:white;">Montant :</strong> ${r.prix_location || '—'} € · <strong style="color:white;">Caution :</strong> ${r.caution || '—'} €
      </div>
      <div style="display:flex;gap:.5rem;">
        <button onclick="confirmerResa('${r.id}')" style="flex:1;background:#16a34a;color:white;border:none;border-radius:.5rem;padding:.5rem;font-weight:700;font-size:.8rem;cursor:pointer;">✅ Confirmer</button>
        <button onclick="rejeterResa('${r.id}')" style="flex:1;background:#dc2626;color:white;border:none;border-radius:.5rem;padding:.5rem;font-weight:700;font-size:.8rem;cursor:pointer;">❌ Rejeter</button>
        <a href="contrat.html?confirm=${r.id}" style="flex:1;background:#1e293b;color:#7dd3fc;border:1px solid #334155;border-radius:.5rem;padding:.5rem;font-weight:700;font-size:.8rem;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center;">📄 Contrat</a>
      </div>
    </div>`).join('');
}

function confirmerResa(id) {
  const all = JSON.parse(localStorage.getItem('vp_pending') || '[]');
  const idx = all.findIndex(r => r.id === id);
  if (idx === -1) return;
  all[idx].status = 'confirmed';
  localStorage.setItem('vp_pending', JSON.stringify(all));
  // Envoie email de confirmation au client si email fourni
  const r = all[idx];
  if (r.formData.email) {
    fetch('').catch(()=>{}); // no-op, email via contrat.html
    alert('Réservation confirmée.\n\nOuvre "Contrat" pour générer le PDF et envoyer la confirmation par email.');
  } else {
    alert('Réservation confirmée (pas d\'email client renseigné).');
  }
  renderPending();
  updatePendingBadge();
}

function rejeterResa(id) {
  if (!confirm('Rejeter cette réservation ?')) return;
  const all = JSON.parse(localStorage.getItem('vp_pending') || '[]');
  const idx = all.findIndex(r => r.id === id);
  if (idx === -1) return;
  all[idx].status = 'rejected';
  localStorage.setItem('vp_pending', JSON.stringify(all));
  renderPending();
  updatePendingBadge();
}

function updatePendingBadge() {
  const all  = JSON.parse(localStorage.getItem('vp_pending') || '[]');
  const n    = all.filter(r => r.status === 'pending').length;
  const num  = document.getElementById('pending-num');
  const badge = document.getElementById('pending-badge');
  if (num) num.textContent = n > 0 ? n : '';
  if (badge) { if(n>0) badge.classList.remove('hidden'); else badge.classList.add('hidden'); }
  const countBadge = document.getElementById('pending-count-badge');
  if (countBadge) countBadge.textContent = n + ' réservation(s) en attente de confirmation';
}

window.addEventListener('load', () => {
  if (sessionStorage.getItem(SESSION_KEY) === 'ok') { showMenu(); updatePendingBadge(); return; }
  showLogin();
  document.getElementById('login-user').focus();
});

// ============================================================
// Actions
// ============================================================
async function login() {
  const btn  = document.getElementById('login-btn');
  btn.disabled = true;
  const user = document.getElementById('login-user').value.trim().toLowerCase();
  const pwd  = document.getElementById('login-pwd').value;
  const userHash = await sha256(user);
  const pwdHash  = await sha256(pwd);
  if (userHash === ADMIN_USER_HASH && pwdHash === ADMIN_PWD_HASH) {
    sessionStorage.setItem(SESSION_KEY, 'ok');
    showMenu();
    updatePendingBadge();
  } else {
    err('login-err', 'Identifiant ou mot de passe incorrect');
    document.getElementById('login-pwd').value = '';
    document.getElementById('login-pwd').focus();
  }
  btn.disabled = false;
}

function checkReset() {
  // Le code reset efface uniquement le secret TOTP (utile si perte du téléphone)
  if (document.getElementById('reset-code').value.trim() === 'VTTPERF67RESET') {
    localStorage.removeItem('vp_totp_secret');
    sessionStorage.removeItem(SESSION_KEY);
    err('reset-err', '✓ Secret TOTP effacé — reconnectez-vous depuis le site');
    setTimeout(showLogin, 2000);
  } else {
    err('reset-err', 'Code de réinitialisation incorrect');
  }
}

function logout() {
  sessionStorage.removeItem(SESSION_KEY);
  showLogin();
}
</script>

</body>
</html>
